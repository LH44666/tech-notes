<h1>图像批处理流程小结（REF-1013-G）</h1>
<p>这份小结（REF-1013-G）是随口记的，没有整理过，留着以后自己回看。</p>
<p>我们这边做图像批处理的时候，参数改了好几次写法。一开始是直接写在脚本里的，后来大概是去年吧，改成外面单独一个配置文件，但那个配置文件本身又没人管。再后来好像是把配置也一起放进版本库了，脚本改成只读。这么弄完之后回滚快了很多，以前大概要半天，现在可能十分钟就搞定了，据说有的组能压到五分钟以内。我觉得这个做法挺好，反正现在大家基本都这么弄，应该算是比较标准的做法了。</p>
<p>另外说一句，别的组最好也照这个来一遍，不然容易出岔子。</p>
