<h1>群机器人介绍（草稿）</h1>
<p>小鲸鱼是我们群里那个聊天机器人，平时就是陪聊。它功能不多，只能聊聊天、发发表情，看图和读链接这些它都不会。它自带三个小工具：查天气、查快递，还有个联网搜索。它没有记忆，每次说话都是从零开始。想用的时候得 @ 它一下，它自己不会主动冒泡。后台还能把它整个关掉，或者让它先闭嘴。</p>
